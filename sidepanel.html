<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WhatsApp Sidebar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:   #00e676;
      --bg:      #0b0f0e;
      --surface: #111816;
      --border:  rgba(0,230,118,.15);
      --txt:     #dff0e8;
      --txt2:    #6d8a80;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      font-family: 'DM Sans', system-ui, sans-serif;
      overflow: hidden;
    }

    .shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Top bar ── */
    .topbar {
      flex-shrink: 0;
      height: 42px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 6px;
      position: relative;
    }
    .topbar::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 10px; right: 10px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,230,118,.3), transparent);
    }

    .logo {
      width: 26px; height: 26px;
      background: rgba(0,230,118,.12);
      border: 1px solid rgba(0,230,118,.25);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo svg { width: 15px; height: 15px; fill: var(--green); }

    .title {
      font-size: 12px; font-weight: 700;
      color: var(--txt);
      flex: 1;
      letter-spacing: .02em;
    }
    .title span { color: var(--green); }

    /* mode pill */
    .mode-pill {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(0,230,118,.08);
      border: 1px solid rgba(0,230,118,.2);
      border-radius: 20px;
      padding: 2px 8px 2px 5px;
      font-size: 10px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: .03em;
      white-space: nowrap;
      transition: all .2s;
      cursor: default;
    }
    .mode-pill .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(.7); }
    }

    .tbtn {
      width: 28px; height: 28px;
      border: none; background: transparent;
      border-radius: 6px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--txt2);
      transition: all .15s;
      flex-shrink: 0;
    }
    .tbtn:hover { background: rgba(255,255,255,.06); color: var(--green); }
    .tbtn svg { width: 15px; height: 15px; fill: currentColor; }

    /* ── Iframe wrapper + CSS injection overlay ── */
    .view-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #waview {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* The CSS injector overlay — sits on top, invisible, used to inject styles via postMessage trick */
    #css-injector {
      display: none;
    }

    /* ── Floating "← Contatos" button (shown when in chat mode) ── */
    #btn-contacts {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 20;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(0,0,0,.4);
      transition: all .2s;
      letter-spacing: .02em;
    }
    #btn-contacts:hover {
      background: rgba(0,230,118,.12);
      border-color: rgba(0,230,118,.4);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0,230,118,.15);
    }
    #btn-contacts svg { width: 13px; height: 13px; fill: currentColor; }
    #btn-contacts.visible { display: flex; }

    /* ── Loading overlay ── */
    #overlay {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 10;
      transition: opacity .4s ease;
    }
    #overlay.fade { opacity: 0; pointer-events: none; }

    .spin-wrap { position: relative; width: 64px; height: 64px; }
    .spin-ring {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--green);
      animation: spin 1s linear infinite;
    }
    .spin-ring:nth-child(2) {
      inset: 8px;
      border-top-color: transparent;
      border-right-color: rgba(0,230,118,.4);
      animation-duration: 1.5s;
      animation-direction: reverse;
    }
    .spin-icon {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .spin-icon svg { width: 26px; height: 26px; fill: var(--green); }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-label { font-size: 12px; color: var(--txt2); letter-spacing: .05em; }
    .loading-label strong { color: var(--green); font-weight: 600; }

    .loading-hint {
      font-size: 10.5px;
      color: var(--txt2);
      opacity: .6;
      max-width: 180px;
      text-align: center;
      line-height: 1.5;
    }

    /* ── Error overlay ── */
    #error-overlay {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      z-index: 11;
    }
    #error-overlay.show { display: flex; }

    .err-icon { font-size: 40px; }
    .err-title { font-size: 14px; font-weight: 700; color: var(--txt); }
    .err-desc { font-size: 11.5px; color: var(--txt2); line-height: 1.6; max-width: 220px; }

    .btn-retry {
      display: flex; align-items: center; gap: 7px;
      padding: 10px 18px;
      background: var(--green);
      border: none; border-radius: 9px;
      color: #061009;
      font-size: 12px; font-weight: 800;
      cursor: pointer;
      transition: all .2s;
    }
    .btn-retry:hover { background: #00ff88; transform: translateY(-1px); }
    .btn-retry svg { width: 14px; height: 14px; fill: currentColor; }

    /* ── Resize handle ── */
    #resize-handle {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 4px;
      background: transparent;
      cursor: col-resize;
      z-index: 30;
      transition: background .2s;
    }
    #resize-handle:hover { background: rgba(0,230,118,.3); }
  </style>
</head>
<body>

<div class="shell">

  <!-- View wrapper -->
  <div class="view-wrap">

    <!-- Floating back-to-contacts button -->

      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      Contatos
    </button> -->

    <div id="error-overlay">
      <div class="err-icon">⚠️</div>
      <div class="err-title">Não foi possível carregar</div>
      <div class="err-desc">O WhatsApp Web bloqueou o carregamento. Tente recarregar ou abra em nova aba.</div>
      <button class="btn-retry" id="btn-retry">

</div>
